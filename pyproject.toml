[project]
name = "sfp"
version = "0.1.0"
description = "TPU kernel development home lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "xprof>=2.20.0",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "pandas",
    "rich>=14.3.1",
]

[project.optional-dependencies]
tpu = ["jax[tpu]>=0.8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
